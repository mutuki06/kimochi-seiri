<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>気持ちの整理</title>
  <meta name="description" content="嫌なことがあったとき、自分まで嫌いになってしまう前に、一緒に整理する場所。">
  <meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="気持ちの整理">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script>
    // 表示設定を描画前に反映してちらつきを防ぐ
    try {
      var p = JSON.parse(localStorage.getItem('kimochi-prefs') || '{}');
      if (p.size) document.documentElement.dataset.size = p.size;
      if (p.theme && p.theme !== 'auto') document.documentElement.dataset.theme = p.theme;
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">気持ちの整理</a>
  </header>
  <main id="main" tabindex="-1">
    <noscript><p>このアプリを使うには JavaScript を有効にしてください。</p></noscript>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
</body>
</html>
